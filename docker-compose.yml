services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: english_practice_backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8016}
      MYSQL_HOST: ${MYSQL_HOST:?请在 .env 中配置外部 MySQL 地址}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
    ports:
      - "${BACKEND_PORT:-8016}:${BACKEND_PORT:-8016}"
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: english_practice_frontend
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8016}
    ports:
      - "${FRONTEND_PORT:-9016}:80"
    depends_on:
      - backend
