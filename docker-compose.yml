services:
  mysql:
    image: mysql:8.0
    container_name: english_practice_mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study}
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: english_practice_backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8016}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
    ports:
      - "${BACKEND_PORT:-8016}:${BACKEND_PORT:-8016}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: english_practice_frontend
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8016}
    ports:
      - "${FRONTEND_PORT:-9016}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
